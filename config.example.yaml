# alcf-proxy configuration (YAML).
# Search order: ./config.yaml, then the platform user-config dir
#   (~/.config/alcf-proxy/config.yaml on Linux, %APPDATA%\alcf-proxy on Windows,
#    ~/Library/Application Support/alcf-proxy on macOS).
# Precedence: CLI flags > env (ALCF_PROXY_*) > this file > built-in defaults.

host: 127.0.0.1
port: 11445                 # use a different port than any other local proxy (e.g. argo-proxy)
cluster: sophia            # primary cluster (used by the fallback chain)
framework: vllm            # primary framework
default_model: openai/gpt-oss-120b
verbose: false

# Unified model routing (default): the proxy resolves any requested model to whichever cluster
# serves it, ordered by this priority; failover between clusters is automatic.
cluster_priority: [sophia, metis, minerva]

# Optional: explicit ordered failover list. Setting this BYPASSES unified routing — every request
# goes through this chain in order regardless of the requested model. When a cluster returns
# 503/maintenance, the proxy advances to the next endpoint and sticks to the one that works.
# NOTE: the model id differs per endpoint (sophia/vllm uses the openai/ prefix; metis/api does not).
# endpoints:
#   - {cluster: sophia, framework: vllm, model: openai/gpt-oss-120b}
#   - {cluster: metis,  framework: api,  model: gpt-oss-120b}
