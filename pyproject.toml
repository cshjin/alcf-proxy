[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alcf-run"
version = "0.1.0"
description = "Unified CLI to launch agentic frameworks against ALCF inference endpoints"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "llm-rosetta[openai]>=0.6.12",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
alcf-run = "alcf_run.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alcf_run*"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real ALCF gateway (need a valid token)"]
