[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alcf-proxy"
version = "0.1.0"
description = "Standalone translating gateway for ALCF inference endpoints (OpenAI chat/responses, Anthropic messages)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "llm-rosetta[openai,anthropic]>=0.6.12",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "globus-sdk>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
alcf-proxy = "alcf_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alcf_proxy*"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real ALCF gateway (need a valid token)"]
addopts = "--cov=alcf_proxy --cov-report=term-missing --cov-fail-under=85 -m 'not live'"
