[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alcf-proxy"
version = "0.3.1"
description = "Standalone translating gateway for ALCF inference endpoints (OpenAI chat/responses, Anthropic messages)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Hongwei Jin", email = "jinh@anl.gov"}]
maintainers = [{name = "Hongwei Jin", email = "jinh@anl.gov"}]
keywords = ["alcf", "llm", "proxy", "gateway", "openai", "anthropic", "codex", "claude", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "llm-rosetta[openai,anthropic]>=0.13.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "globus-sdk>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "build>=1.0", "twine>=5.0"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "pymdown-extensions>=10.0"]

[project.urls]
Homepage = "https://github.com/cshjin/alcf-proxy"
Repository = "https://github.com/cshjin/alcf-proxy"
Issues = "https://github.com/cshjin/alcf-proxy/issues"

[project.scripts]
alcf-proxy = "alcf_proxy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alcf_proxy*"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real ALCF gateway (need a valid token)"]
addopts = "--cov=alcf_proxy --cov-report=term-missing --cov-fail-under=85 -m 'not live'"
